[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-mcp"
version = "0.1.0"
description = "Always-on MCP server for Polymarket prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "py-clob-client>=0.28.0",
    "websockets>=12.0",
    "eth-account>=0.11.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
polymarket-mcp = "polymarket_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
