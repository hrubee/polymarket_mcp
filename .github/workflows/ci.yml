name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - name: Run safety tests (no API calls)
        run: uv run pytest tests/test_safety.py -v
      - name: Run DEMO mode tests
        env:
          DEMO_MODE: "true"
        run: uv run pytest tests/test_markets.py tests/test_orderbook.py -v --timeout=30
